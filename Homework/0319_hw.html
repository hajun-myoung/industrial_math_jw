<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compmath assignment numbuer4</title>
</head>
<body>

    <script>
        const imgTag = document.createElement('img');
        
        const imageUrl = "https://images.unsplash.com/photo-1768434118991-667871772318?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D";
        imgTag.src = imageUrl;

        imgTag.style.width = "300px";

        document.body.appendChild(imgTag);

        const ulTag = document.createElement('ul');

        const items = ["하나", "둘", "셋"];

        for (const text of items) {
            const liTag = document.createElement('li');
            liTag.textContent = text;
            ulTag.appendChild(liTag);
        };

        document.body.appendChild(ulTag);

        //ul: 순서없는 목록, ol: 순서있는 목록 (항목 앞에 숫자가 자동으로 붙음), li: 리스트의 개별항목 표시 (ul이나 ol안에 있어야함.)
    </script>
    
</body>
</html>
