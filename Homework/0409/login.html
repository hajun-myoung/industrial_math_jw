<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
  </head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Apple SD Gothic Neo', sans-serif;
    }
    .container {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 350px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(to right, #6a11cb, #2575fc); /* 버튼 그라데이션 */
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .footer-link {
      margin-top: 15px;
      font-size: 13px;
      color: #777;
    }
    .footer-link a {
      color: #6a11cb;
      text-decoration: none;
    }
  </style>

  <body>
    <div class="container">
      <h2>로그인</h2>
      <input type="email" id="loginEmail" placeholder="이메일" /><br />
      <input type="password" id="loginPw" placeholder="비밀번호" /><br />
      <button onclick="login()">로그인</button>
    </div>
    <script>
      function login() {
        const savedData = JSON.parse(localStorage.getItem('userData'));
        const inputEmail = document.getElementById('loginEmail').value;
        const inputPw = document.getElementById('loginPw').value;

        if (savedData && inputEmail === savedData.email && inputPw === savedData.pw) {
          location.href = 'welcome.html';
        } else {
          alert('이메일 또는 비밀번호가 일치하지 않습니다.');
        }
      }
    </script>
  </body>
</html>
