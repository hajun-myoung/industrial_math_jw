<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
  </head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Apple SD Gothic Neo', sans-serif;
    }
    .container {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 350px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(to right, #6a11cb, #2575fc); /* 버튼 그라데이션 */
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .footer-link {
      margin-top: 15px;
      font-size: 13px;
      color: #777;
    }
    .footer-link a {
      color: #6a11cb;
      text-decoration: none;
    }
  </style>

  <body>
    <div class="container">
      <h2>회원가입</h2>
      <input type="email" id="email" placeholder="이메일" />
      <input type="password" id="pw" placeholder="비밀번호" />
      <input type="password" id="pwConfirm" placeholder="비밀번호 확인" />

      <button onclick="signUp()">가입하기</button>

      <div class="footer-link">이미 계정이 있으신가요? <a href="login.html">로그인</a></div>
    </div>
    <script>
      function signUp() {
        const email = document.getElementById('email').value;
        const pw = document.getElementById('pw').value;
        const pwConfirm = document.getElementById('pwConfirm').value;
        if (!email || !pw || !pwConfirm) {
          alert('모든 항목을 입력해주세요.');
          return;
        }
        if (pw !== pwConfirm) {
          alert('비밀번호가 일치하지 않습니다. 다시 확인해주세요.');
          return;
        }
        const user = {
          email: email,
          pw: pw,
        };
        localStorage.setItem('userData', JSON.stringify(user));
        alert('가입 완료! 로그인 페이지로 이동합니다.');
        location.href = 'login.html';
      }
    </script>
  </body>
</html>
