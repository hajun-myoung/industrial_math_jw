<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiosk</title>
    <link rel="stylesheet" href="index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <button id="adminLoginBtn">관리자</button>
    </header>

    <main class="container">
      <h1>카페에 오신 걸 환영합니다.</h1>
      <div class="kiosk-main-wrapper">
        <div class="menu-list" id="menuList"></div>
        <div class="order-sidebar" id="orderList"></div>
      </div>
    </main>

    <div id="loginModal" class="login-modal">
      <div class="login-content">
        <form id="loginForm">
          <div class="form-control">
            <label for="username">사용자명</label>
            <input type="text" id="username" />
          </div>
          <div class="form-control">
            <label for="password">비밀번호</label>
            <input type="password" id="password" />
          </div>
          <button type="submit">로그인</button>
        </form>
      </div>
    </div>
    <div id="paymentModal" class="login-modal">
      <div class="login-content" style="width: 400px">
        <h2>💳 결제 수단 선택</h2>
        <hr style="border: 0; height: 1px; background: #eee; margin-bottom: 20px" />

        <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px">
          <label
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              cursor: pointer;
              padding: 10px;
              border: 1px solid #ddd;
              border-radius: 6px;
            "
          >
            <input type="radio" name="paymentMethod" value="cash" checked /> 💵 현금 결제
          </label>
          <label
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              cursor: pointer;
              padding: 10px;
              border: 1px solid #ddd;
              border-radius: 6px;
            "
          >
            <input type="radio" name="paymentMethod" value="card" /> 💳 카드 결제
          </label>
          <label
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              cursor: pointer;
              padding: 10px;
              border: 1px solid #ddd;
              border-radius: 6px;
            "
          >
            <input type="radio" name="paymentMethod" value="kakao" /> 🟡 카카오페이
          </label>
        </div>

        <div class="modal-buttons" style="display: flex; gap: 10px">
          <button
            id="finalCheckoutBtn"
            style="
              flex: 1;
              height: 44px;
              background-color: #4caf50;
              color: white;
              border: none;
              border-radius: 6px;
              font-size: 16px;
              font-weight: bold;
              cursor: pointer;
            "
          >
            최종 결제하기
          </button>
          <button
            id="paymentCancelBtn"
            style="
              flex: 1;
              height: 44px;
              background-color: #e0e0e0;
              color: #333;
              border: none;
              border-radius: 6px;
              font-size: 16px;
              font-weight: bold;
              cursor: pointer;
            "
          >
            취소
          </button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
